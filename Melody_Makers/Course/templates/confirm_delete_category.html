{% extends 'base.html' %}
{% load static %}
{% load humanize %}

{% block content %}

<header class="site-header section-padding d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row">
          <center>
            <div class="col-lg-10 col-12 " dir="rtl">
              <h1>
                  <span class=" text-dark"> حذف دسته بندی </span>
                  <span class="text-primary">{{category.name}}</span>
              </h1>
          </div>
          </center>
        </div>
    </div>
  </header>
 <section dir="rtl" class="" >
    <div class="container py-5 form-container">
        <div class="row d-flex justify-content-center align-items-center ">
            <h5>آیا مطمئن هستید میخواهید "{{ category.name }}" را حذف کنید ؟</h5>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">بله، حذف کن</button>
                <a href="{% url 'category_summary' %}" class="btn btn-secondary">لغو</a>
            </form>

        </div>
    </div>
  </section>

  <style>
    /* Custom CSS to set max width and center the form */
    .form-container {
        max-width: 800px;  /* Set the desired width */
        margin: 0 auto;  /* Center the form */
    }
</style>

{% endblock content %}
