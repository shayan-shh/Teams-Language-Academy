{% extends "base.html" %}

{%block content %}
<main>

  <section class="sign-in-form section-padding mt-5">
      <div class="container">
          <div class="row">

              <div class="col-lg-8 mx-auto col-12">

                  <h1 class="hero-title text-center mb-5">ورود به حساب کاربری</h1>

                  <div class="row">
                      <div class="col-lg-8 col-11 mx-auto">
                          <form role="form" method="post">
                            {% csrf_token %}
                              <div class="form-floating mb-4 p-0">
                                  <input type="text" name="username" id="username" class="form-control" placeholder=" نام کاربری" required>

                                  <label for="email">نام کاربری</label>
                              </div>

                              <div class="form-floating p-0">
                                  <input type="password" name="password" id="password" class="form-control" placeholder="Password" required>

                                  <label for="password">رمز عبور</label>
                              </div>

                              <button type="submit" class="btn custom-btn form-control mt-4 mb-3">
                                  ورود
                              </button>

                              <p class="text-center ">آیا حساب کاربری ندارید؟<a class="mx-2" href="{% url 'signup' %}">ایجاد حساب جدید </a></p>

                          </form>
                      </div>
                  </div>
                  
              </div>

          </div>
      </div>
  </section>

</main>

{% endblock %}
