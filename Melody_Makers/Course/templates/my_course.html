{% extends "base.html" %}
{% load static %}
{% load humanize %}

{% block content %}
<header class="site-header section-padding d-flex justify-content-center align-items-center">
    <div class="container">
        <div class="row">
          <center>
            <div class="col-lg-10 col-12 " dir="rtl">
              <h1>
                  <span class=" text-dark"> آموزش های  </span>
                  <span class="text-primary">   من</span>
              </h1>
          </div>
          </center>
        </div>
    </div>
  </header>
<!-- Section-->
<section class="py-5">
    <div class="container px-4 px-lg-5 mt-5">
        <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
            {% for item in purchased_courses %}
            
            <div class="col mb-5">
                <div class="card h-100">
                    <!-- Product image-->
                    <img class="card-img-top" src="{{item.picture.url}}" alt="..." />
                    <!-- Product details-->
                    <div class="card-body p-4">
                        <div class="text-center">
                            <!-- Product name-->
                            <h5 class="fw-bolder">{{item.name}}</h5>                            
                            <!-- Product price-->
                                                       
                            
                                {{item.length}} <br>
                            

                                {{item.days}} <br>
                                {{item.teacher_name}}
                            
                        </div>
                    </div>
                    <!-- Product actions-->
                    
                </div>
            </div>
            
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
