{% extends "base.html" %}

{%block content %}



<main>

  <section class="sign-in-form section-padding mt-5" dir="rtl">
      <div class="container">
          <div class="row">

              <div class="col-lg-8 mx-auto col-12">

                  <h1 class="hero-title text-center mb-5">ثبت نام</h1>

                  <div class="row">
                      <div class="col-lg-8 col-11 mx-auto">
                          <form role="form" method="post">

                              {% csrf_token %}
                              {{form.as_p}}

                              <button type="submit" class="btn custom-btn form-control mt-4 mb-3">
                                  ثبت نام
                              </button>

                              <p class="text-center">حساب کاربری دارید؟  <a class="mx-2" href="{% url 'login' %}">ورود</a></p>

                          </form>
                      </div>
                  </div>
                  
              </div>

          </div>
      </div>
  </section>

</main>

{% endblock %}
