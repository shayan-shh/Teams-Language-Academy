{% extends "base.html" %}

{%block content %}
<header class="site-header section-padding d-flex justify-content-center align-items-center">
  <div class="container">
      <div class="row">

          <div class="col-lg-10 col-12" dir="rtl">
              <h1>
                  <span class=" text-primary">   اطلاعات تکمیلی و</span>
                  <span class="text-dark">اینجا میتونی تمکیل کنی </span>
              </h1>
          </div>
      </div>
  </div>
</header>
<main>

  <section class="sign-in-form section-padding" dir="rtl">
      <div class="container">
          <div class="row">

              <div class="col-lg-8 mx-auto col-12">
                  <div class="row">
                      <div class="col-lg-8 col-11 mx-auto">
                          <form role="form" method="post">

                              {% csrf_token %}
                              {{form.as_p}}

                              <button type="submit" class="btn custom-btn form-control mt-4 mb-3">
                                  ثببت
                              </button>

                               <center>
                                <a class="text-center mt-1" href="{% url 'home' %}">بازگشت</a>
                               </center>

                          </form>
                      </div>
                  </div>
                  
              </div>

          </div>
      </div>
  </section>

</main>
{% endblock %}
