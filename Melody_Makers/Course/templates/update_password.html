{% extends "base.html" %}

{%block content %}
<header class="site-header section-padding d-flex justify-content-center align-items-center">
  <div class="container">
      <div class="row">

          <div class="col-lg-10 col-12" dir="rtl">
              <h1>
                  <span class=" text-primary"> رمز عبور خود را </span>
                  <span class="text-dark">اینجا میتونی ویرایش کنی </span>
              </h1>
          </div>
      </div>
  </div>
</header>
<section class="vh-100 mt-5" dir="rtl">
  <div class="container-fluid h-custom">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        <form method="post" action="{% url 'update_password' %}">
          {% csrf_token %}
          {{form.as_p}}
          <br><br>



         

          <!-- register -->
          <div class="text-center text-lg-start mt-4 pt-2">
            <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-dark flex-shrink-0 m-1"
              style="padding-left: 2.5rem; padding-right: 2.5rem;">ویرایش </button>
              <a class="btn btn-outline-dark flex-shrink-0  m-1" href="{% url 'home' %}">
                بازشگت  
                <i class="bi bi-arrow-left-circle"></i>
               </a>
          </div>
        </form>
      </div>
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
          class="img-fluid" alt="Sample image">
      </div>
      
    </div>
  </div>
</section>
{% endblock %}
